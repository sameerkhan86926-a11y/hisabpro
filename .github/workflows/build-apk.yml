name: Build HisabPro APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. NODE 24
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # --------------------------------------------------
      # 3. JAVA 17
      # --------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 4. INSTALL DEPENDENCIES
      # --------------------------------------------------

      - name: Install dependencies
        run: npm install


      # --------------------------------------------------
      # 5. BUILD NEXT.JS WEBSITE
      # --------------------------------------------------

      - name: Build Next.js website
        run: npm run build


      # --------------------------------------------------
      # 6. CHECK WEBSITE OUTPUT
      # --------------------------------------------------

      - name: Verify website output
        run: |
          echo "===== OUT DIRECTORY ====="
          find out -maxdepth 3 -type f | sort | head -300

          echo ""
          echo "===== CSS FILES ====="
          find out -type f | grep "_next/static/css" | head -50 || true

          echo ""
          echo "===== JS FILES ====="
          find out -type f | grep "_next/static/chunks" | head -50 || true

          echo ""
          echo "===== HTML FILES ====="
          find out -type f -name "*.html" | sort


      # --------------------------------------------------
      # 7. ANDROID SDK PATH
      # --------------------------------------------------

      - name: Setup Android SDK PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH


      # --------------------------------------------------
      # 8. ANDROID SDK
      # --------------------------------------------------

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # --------------------------------------------------
      # 9. CREATE ANDROID PROJECT
      # --------------------------------------------------

      - name: Create Android project
        run: |
          mkdir -p android/app/src/main/java/com/hisabpro/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/assets/hisabpro


      # --------------------------------------------------
      # 10. ANDROIDX
      # --------------------------------------------------

      - name: Create gradle.properties
        run: |
          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF


      # --------------------------------------------------
      # 11. COPY NEXT.JS WEBSITE
      # --------------------------------------------------

      - name: Copy website into APK assets
        run: |
          rm -rf android/app/src/main/assets/hisabpro/*
          cp -R out/. android/app/src/main/assets/hisabpro/


      # --------------------------------------------------
      # 12. VERIFY COPIED WEBSITE
      # --------------------------------------------------

      - name: Verify APK website assets
        run: |
          echo "===== APK ASSETS ====="
          find android/app/src/main/assets/hisabpro -maxdepth 3 -type f | sort | head -300

          echo ""
          echo "===== CSS ====="
          find android/app/src/main/assets/hisabpro \
            -type f \
            | grep "_next/static/css" \
            | head -50 || true

          echo ""
          echo "===== JS ====="
          find android/app/src/main/assets/hisabpro \
            -type f \
            | grep "_next/static/chunks" \
            | head -50 || true


      # --------------------------------------------------
      # 13. COPY HISABPRO LOGO
      # --------------------------------------------------

      - name: Copy HisabPro launcher logo
        run: |
          if [ -f "public/icon-512.png" ]; then

            cp public/icon-512.png \
              android/app/src/main/res/drawable/ic_launcher.png

          elif [ -f "public/icon-192.png" ]; then

            cp public/icon-192.png \
              android/app/src/main/res/drawable/ic_launcher.png

          else

            echo "ERROR: HisabPro logo not found."

            exit 1

          fi


      # --------------------------------------------------
      # 14. SETTINGS.GRADLE
      # --------------------------------------------------

      - name: Create settings.gradle
        run: |
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HisabPro"

          include(":app")
          EOF


      # --------------------------------------------------
      # 15. ROOT BUILD.GRADLE
      # --------------------------------------------------

      - name: Create root build.gradle
        run: |
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


      # --------------------------------------------------
      # 16. APP BUILD.GRADLE
      # --------------------------------------------------

      - name: Create app build.gradle
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.hisabpro.app'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.hisabpro.app'

                  minSdk 23

                  targetSdk 35

                  versionCode 1

                  versionName '1.0'
              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {

                  debug {

                      minifyEnabled false
                  }

                  release {

                      minifyEnabled false
                  }
              }
          }

          dependencies {

              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF


      # --------------------------------------------------
      # 17. ANDROID MANIFEST
      # --------------------------------------------------

      - name: Create AndroidManifest.xml
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application

                  android:allowBackup="true"

                  android:label="HisabPro"

                  android:icon="@drawable/ic_launcher"

                  android:roundIcon="@drawable/ic_launcher"

                  android:theme="@style/AppTheme"

                  android:usesCleartextTraffic="true">

                  <activity

                      android:name=".MainActivity"

                      android:exported="true"

                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # --------------------------------------------------
      # 18. ANDROID STYLE
      # --------------------------------------------------

      - name: Create styles.xml
        run: |
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #1559B7
                  </item>

                  <item name="android:navigationBarColor">
                      #FFFFFF
                  </item>

                  <item name="android:statusBarColor">
                      #102A56
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:windowActionModeOverlay">
                      true
                  </item>

              </style>

          </resources>
          EOF


      # --------------------------------------------------
      # 19. MAIN ACTIVITY
      # --------------------------------------------------

      - name: Create MainActivity.java
        run: |
          cat > android/app/src/main/java/com/hisabpro/app/MainActivity.java <<'EOF'
          package com.hisabpro.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.MimeTypeMap;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;

          public class MainActivity extends Activity {

              private WebView webView;

              private WebViewAssetLoader assetLoader;

              private static final String APP_HOST =
                      "appassets.androidplatform.net";


              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {

                  super.onCreate(savedInstanceState);


                  webView = new WebView(this);

                  setContentView(webView);


                  WebSettings settings =
                          webView.getSettings();


                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);


                  settings.setAllowFileAccess(false);

                  settings.setAllowContentAccess(false);


                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);


                  settings.setMediaPlaybackRequiresUserGesture(
                          false
                  );


                  settings.setJavaScriptCanOpenWindowsAutomatically(
                          true
                  );


                  assetLoader =
                          new WebViewAssetLoader.Builder()

                                  .addPathHandler(
                                          "/assets/",
                                          new WebViewAssetLoader
                                                  .AssetsPathHandler(
                                                          this
                                                  )
                                  )

                                  .addPathHandler(
                                          "/hisabpro/",
                                          new HisabProPathHandler()
                                  )

                                  .build();


                  webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public boolean shouldOverrideUrlLoading(
                                      WebView view,
                                      WebResourceRequest request
                              ) {

                                  Uri uri =
                                          request.getUrl();


                                  String host =
                                          uri.getHost();


                                  String path =
                                          uri.getPath();


                                  if (
                                          APP_HOST.equals(host)
                                                  && path != null
                                                  && path.startsWith(
                                                          "/hisabpro/"
                                                  )
                                  ) {

                                      loadHisabProPage(
                                              path
                                      );

                                      return true;
                                  }


                                  return false;
                              }


                              @Override
                              public boolean shouldOverrideUrlLoading(
                                      WebView view,
                                      String url
                              ) {

                                  Uri uri =
                                          Uri.parse(url);


                                  String host =
                                          uri.getHost();


                                  String path =
                                          uri.getPath();


                                  if (
                                          APP_HOST.equals(host)
                                                  && path != null
                                                  && path.startsWith(
                                                          "/hisabpro/"
                                                  )
                                  ) {

                                      loadHisabProPage(
                                              path
                                      );

                                      return true;
                                  }


                                  return false;
                              }


                              @Override
                              public WebResourceResponse shouldInterceptRequest(
                                      WebView view,
                                      WebResourceRequest request
                              ) {

                                  return assetLoader
                                          .shouldInterceptRequest(
                                                  request.getUrl()
                                          );
                              }


                              @Override
                              public WebResourceResponse shouldInterceptRequest(
                                      WebView view,
                                      String url
                              ) {

                                  return assetLoader
                                          .shouldInterceptRequest(
                                                  Uri.parse(url)
                                          );
                              }
                          }
                  );


                  loadHisabProPage(
                          "/hisabpro/"
                  );
              }


              private void loadHisabProPage(
                      String path
              ) {

                  String cleanPath =
                          path;


                  while (
                          cleanPath.startsWith("/")
                  ) {

                      cleanPath =
                              cleanPath.substring(1);
                  }


                  if (
                          cleanPath.equals("hisabpro")
                                  || cleanPath.equals(
                                          "hisabpro/"
                                  )
                  ) {

                      cleanPath =
                              "hisabpro/index.html";

                  } else if (
                          cleanPath.startsWith(
                                  "hisabpro/"
                          )
                  ) {

                      String pagePath =
                              cleanPath.substring(
                                      "hisabpro/".length()
                              );


                      if (
                              pagePath.endsWith("/")
                      ) {

                          pagePath += "index.html";
                      }


                      if (
                              !pagePath.contains(".")
                      ) {

                          pagePath +=
                                  "/index.html";
                      }


                      cleanPath =
                              "hisabpro/"
                                      + pagePath;
                  }


                  try {

                      InputStream inputStream =
                              getAssets().open(
                                      cleanPath
                              );


                      byte[] data =
                              readAllBytes(
                                      inputStream
                              );


                      inputStream.close();


                      String html =
                              new String(
                                      data,
                                      java.nio.charset
                                              .StandardCharsets
                                              .UTF_8
                              );


                      int lastSlash =
                              cleanPath.lastIndexOf("/");


                      String basePath;


                      if (lastSlash >= 0) {

                          basePath =
                                  cleanPath.substring(
                                          0,
                                          lastSlash + 1
                                  );

                      } else {

                          basePath =
                                  "hisabpro/";
                      }


                      String baseUrl =
                              "https://"
                                      + APP_HOST
                                      + "/"
                                      + basePath;


                      webView.loadDataWithBaseURL(

                              baseUrl,

                              html,

                              "text/html",

                              "UTF-8",

                              null
                      );

                  } catch (
                          IOException e
                  ) {

                      String errorHtml =
                              "<html>"
                                      + "<body>"
                                      + "<h2>Page not found</h2>"
                                      + "<p>"
                                      + cleanPath
                                      + "</p>"
                                      + "</body>"
                                      + "</html>";


                      webView.loadData(
                              errorHtml,
                              "text/html",
                              "UTF-8"
                      );
                  }
              }


              private byte[] readAllBytes(
                      InputStream inputStream
              ) throws IOException {

                  ByteArrayOutputStream buffer =
                          new ByteArrayOutputStream();


                  byte[] data =
                          new byte[8192];


                  int n;


                  while (
                          (
                                  n =
                                          inputStream.read(
                                                  data
                                          )
                          ) != -1
                  ) {

                      buffer.write(
                              data,
                              0,
                              n
                      );
                  }


                  return buffer.toByteArray();
              }


              private class HisabProPathHandler
                      implements
                      WebViewAssetLoader.PathHandler {

                  @Override
                  public WebResourceResponse handle(
                          String path
                  ) {

                      String cleanPath =
                              path;


                      while (
                              cleanPath.startsWith("/")
                      ) {

                          cleanPath =
                                  cleanPath.substring(1);
                      }


                      if (
                              cleanPath.isEmpty()
                      ) {

                          cleanPath =
                                  "index.html";
                      }


                      String assetPath =
                              "hisabpro/"
                                      + cleanPath;


                      try {

                          InputStream inputStream =
                                  getAssets().open(
                                          assetPath
                                  );


                          String mimeType =
                                  getMimeType(
                                          cleanPath
                                  );


                          return new WebResourceResponse(

                                  mimeType,

                                  "UTF-8",

                                  inputStream
                          );

                      } catch (
                              IOException e
                      ) {

                          return null;
                      }
                  }
              }


              private String getMimeType(
                      String path
              ) {

                  String extension =
                          "";


                  int dot =
                          path.lastIndexOf(".");


                  if (
                          dot >= 0
                                  && dot < path.length() - 1
                  ) {

                      extension =
                              path.substring(
                                      dot + 1
                              );
                  }


                  String mimeType =
                          MimeTypeMap
                                  .getSingleton()
                                  .getMimeTypeFromExtension(
                                          extension
                                                  .toLowerCase()
                                  );


                  if (
                          mimeType != null
                  ) {

                      return mimeType;
                  }


                  if (
                          path.endsWith(".js")
                  ) {

                      return "application/javascript";
                  }


                  if (
                          path.endsWith(".css")
                  ) {

                      return "text/css";
                  }


                  if (
                          path.endsWith(".json")
                  ) {

                      return "application/json";
                  }


                  if (
                          path.endsWith(".svg")
                  ) {

                      return "image/svg+xml";
                  }


                  if (
                          path.endsWith(".html")
                  ) {

                      return "text/html";
                  }


                  if (
                          path.endsWith(".png")
                  ) {

                      return "image/png";
                  }


                  if (
                          path.endsWith(".jpg")
                              || path.endsWith(".jpeg")
                  ) {

                      return "image/jpeg";
                  }


                  if (
                          path.endsWith(".webp")
                  ) {

                      return "image/webp";
                  }


                  if (
                          path.endsWith(".woff")
                  ) {

                      return "font/woff";
                  }


                  if (
                          path.endsWith(".woff2")
                  ) {

                      return "font/woff2";
                  }


                  return "text/plain";
              }


              @Override
              public void onBackPressed() {

                  if (
                          webView != null
                                  && webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }


              @Override
              protected void onDestroy() {

                  if (
                          webView != null
                  ) {

                      webView.loadUrl(
                              "about:blank"
                      );

                      webView.stopLoading();

                      webView.setWebViewClient(
                              null
                      );

                      webView.destroy();

                      webView = null;
                  }


                  super.onDestroy();
              }
          }
          EOF


      # --------------------------------------------------
      # 20. DOWNLOAD GRADLE
      # --------------------------------------------------

      - name: Download Gradle
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip

          unzip -q gradle-8.10.2-bin.zip


      # --------------------------------------------------
      # 21. BUILD APK
      # --------------------------------------------------

      - name: Build APK
        working-directory: android
        run: |
          ../gradle-8.10.2/bin/gradle \
            assembleDebug \
            --stacktrace


      # --------------------------------------------------
      # 22. VERIFY APK
      # --------------------------------------------------

      - name: Verify APK
        run: |

          echo "===== APK FILE ====="

          ls -lh \
            android/app/build/outputs/apk/debug/


          echo ""

          echo "===== APK SIZE ====="

          du -h \
            android/app/build/outputs/apk/debug/app-debug.apk


          echo ""

          echo "===== INDEX HTML ====="

          unzip -l \
            android/app/build/outputs/apk/debug/app-debug.apk \
            | grep "assets/hisabpro/index.html"


          echo ""

          echo "===== CSS FILES ====="

          unzip -l \
            android/app/build/outputs/apk/debug/app-debug.apk \
            | grep "assets/hisabpro/_next/static/css" \
            | head -50 || true


          echo ""

          echo "===== JS FILES ====="

          unzip -l \
            android/app/build/outputs/apk/debug/app-debug.apk \
            | grep "assets/hisabpro/_next/static/chunks" \
            | head -50 || true


          echo ""

          echo "===== HTML PAGES ====="

          unzip -l \
            android/app/build/outputs/apk/debug/app-debug.apk \
            | grep "assets/hisabpro/.*index.html" \
            | head -100 || true


          echo ""

          echo "===== LAUNCHER ICON ====="

          unzip -l \
            android/app/build/outputs/apk/debug/app-debug.apk \
            | grep "ic_launcher.png"


      # --------------------------------------------------
      # 23. UPLOAD APK
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: HisabPro-APK

          path:
            android/app/build/outputs/apk/debug/app-debug.apk
