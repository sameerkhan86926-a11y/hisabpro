name: Build HisabPro APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # CHECKOUT
      # =========================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================
      # NODE.JS
      # =========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # =========================================
      # JAVA
      # =========================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================
      # INSTALL WEBSITE DEPENDENCIES
      # =========================================

      - name: Install dependencies
        run: npm install


      # =========================================
      # BUILD NEXT.JS WEBSITE
      # =========================================

      - name: Build Next.js website
        run: npm run build


      # =========================================
      # ANDROID SDK
      # =========================================

      - name: Setup Android SDK PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH


      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # =========================================
      # CREATE ANDROID PROJECT
      # =========================================

      - name: Create Android project
        run: |
          mkdir -p android/app/src/main/java/com/hisabpro/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/assets/hisabpro

          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF


      # =========================================
      # COPY WEBSITE INTO APK
      # =========================================

      - name: Copy website into APK
        run: |
          cp -R out/. android/app/src/main/assets/hisabpro/

          echo "========================================"
          echo "WEBSITE FILES"
          echo "========================================"

          find android/app/src/main/assets/hisabpro \
            -maxdepth 2 \
            -type f | head -80


      # =========================================
      # COPY HISABPRO LAUNCHER LOGO
      # =========================================

      - name: Copy HisabPro launcher logo
        run: |

          if [ -f "public/icon-512.png" ]; then

            cp public/icon-512.png \
              android/app/src/main/res/drawable/ic_launcher.png

          elif [ -f "public/icon-192.png" ]; then

            cp public/icon-192.png \
              android/app/src/main/res/drawable/ic_launcher.png

          else

            echo "ERROR: HisabPro logo not found."

            exit 1

          fi

          echo "========================================"
          echo "LAUNCHER ICON"
          echo "========================================"

          ls -lh \
            android/app/src/main/res/drawable/ic_launcher.png


      # =========================================
      # SETTINGS.GRADLE
      # =========================================

      - name: Create settings.gradle
        run: |
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HisabPro"

          include(":app")
          EOF


      # =========================================
      # ROOT BUILD.GRADLE
      # =========================================

      - name: Create root build.gradle
        run: |
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


      # =========================================
      # APP BUILD.GRADLE
      # =========================================

      - name: Create app build.gradle
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hisabpro.app'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.hisabpro.app'

                  minSdk 23

                  targetSdk 35

                  versionCode 1

                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {

                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {

              implementation 'androidx.webkit:webkit:1.12.1'

          }
          EOF


      # =========================================
      # ANDROID MANIFEST
      # =========================================

      - name: Create AndroidManifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="HisabPro"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # =========================================
      # APP THEME
      # =========================================

      - name: Create styles
        run: |
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">
                      #1559B7
                  </item>

                  <item name="android:navigationBarColor">
                      #FFFFFF
                  </item>

                  <item name="android:statusBarColor">
                      #102A56
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>
          EOF


      # =========================================
      # MAIN ACTIVITY
      # =========================================

      - name: Create MainActivity
        run: |
          cat > android/app/src/main/java/com/hisabpro/app/MainActivity.java <<'EOF'
          package com.hisabpro.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.MimeTypeMap;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          import java.io.IOException;
          import java.io.InputStream;

          public class MainActivity extends Activity {

              private WebView webView;

              private WebViewAssetLoader assetLoader;


              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  // =====================================
                  // CREATE WEBVIEW
                  // =====================================

                  webView = new WebView(this);

                  setContentView(webView);


                  // =====================================
                  // WEBVIEW SETTINGS
                  // =====================================

                  WebSettings settings =
                          webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(false);

                  settings.setAllowContentAccess(false);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setMediaPlaybackRequiresUserGesture(false);


                  // =====================================
                  // LOCAL ASSET LOADER
                  // =====================================

                  assetLoader =
                          new WebViewAssetLoader.Builder()

                                  // Handles:
                                  // /assets/hisabpro/...
                                  .addPathHandler(
                                          "/assets/",
                                          new WebViewAssetLoader.AssetsPathHandler(
                                                  this
                                          )
                                  )

                                  // Handles:
                                  // /hisabpro/...
                                  .addPathHandler(
                                          "/hisabpro/",
                                          new HisabProPathHandler()
                                  )

                                  .build();


                  // =====================================
                  // WEBVIEW CLIENT
                  // =====================================

                  webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public WebResourceResponse
                              shouldInterceptRequest(
                                      WebView view,
                                      WebResourceRequest request
                              ) {

                                  return assetLoader
                                          .shouldInterceptRequest(
                                                  request.getUrl()
                                          );
                              }


                              @Override
                              public WebResourceResponse
                              shouldInterceptRequest(
                                      WebView view,
                                      String url
                              ) {

                                  return assetLoader
                                          .shouldInterceptRequest(
                                                  Uri.parse(url)
                                          );
                              }
                          }
                  );


                  // =====================================
                  // LOAD HISABPRO
                  // =====================================

                  webView.loadUrl(
                          "https://appassets.androidplatform.net/assets/hisabpro/index.html"
                  );
              }


              // =====================================
              // HISABPRO PATH HANDLER
              // =====================================

              private class HisabProPathHandler
                      implements WebViewAssetLoader.PathHandler {

                  @Override
                  public WebResourceResponse handle(String path) {

                      String cleanPath = path;

                      while (cleanPath.startsWith("/")) {
                          cleanPath =
                                  cleanPath.substring(1);
                      }

                      if (cleanPath.isEmpty()) {
                          cleanPath = "index.html";
                      }

                      String assetPath =
                              "hisabpro/" + cleanPath;


                      try {

                          InputStream inputStream =
                                  getAssets().open(assetPath);

                          String mimeType =
                                  getMimeType(cleanPath);


                          return new WebResourceResponse(
                                  mimeType,
                                  "UTF-8",
                                  inputStream
                          );

                      } catch (IOException e) {

                          return null;
                      }
                  }
              }


              // =====================================
              // MIME TYPE
              // =====================================

              private String getMimeType(String path) {

                  String extension = "";

                  int dot =
                          path.lastIndexOf(".");


                  if (dot >= 0 &&
                          dot < path.length() - 1) {

                      extension =
                              path.substring(dot + 1);
                  }


                  String mimeType =
                          MimeTypeMap
                                  .getSingleton()
                                  .getMimeTypeFromExtension(
                                          extension.toLowerCase()
                                  );


                  if (mimeType != null) {
                      return mimeType;
                  }


                  if (path.endsWith(".js")) {
                      return "application/javascript";
                  }


                  if (path.endsWith(".css")) {
                      return "text/css";
                  }


                  if (path.endsWith(".json")) {
                      return "application/json";
                  }


                  if (path.endsWith(".svg")) {
                      return "image/svg+xml";
                  }


                  if (path.endsWith(".html")) {
                      return "text/html";
                  }


                  if (path.endsWith(".png")) {
                      return "image/png";
                  }


                  if (path.endsWith(".jpg") ||
                          path.endsWith(".jpeg")) {

                      return "image/jpeg";
                  }


                  if (path.endsWith(".webp")) {
                      return "image/webp";
                  }


                  return "text/plain";
              }


              // =====================================
              // ANDROID BACK BUTTON
              // =====================================

              @Override
              public void onBackPressed() {

                  if (webView != null &&
                          webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }
              }


              // =====================================
              // CLEANUP
              // =====================================

              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.loadUrl("about:blank");

                      webView.stopLoading();

                      webView.setWebViewClient(null);

                      webView.destroy();

                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF


      # =========================================
      # DOWNLOAD GRADLE
      # =========================================

      - name: Download Gradle
        run: |

          wget -q \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip

          unzip -q gradle-8.10.2-bin.zip


      # =========================================
      # BUILD APK
      # =========================================

      - name: Build APK
        working-directory: android
        run: |

          ../gradle-8.10.2/bin/gradle assembleDebug


      # =========================================
      # VERIFY APK
      # =========================================

      - name: Verify APK
        run: |

          echo "========================================"
          echo "APK FILE"
          echo "========================================"

          ls -lh \
            android/app/build/outputs/apk/debug/


          echo "========================================"
          echo "APK SIZE"
          echo "========================================"

          du -h \
            android/app/build/outputs/apk/debug/app-debug.apk


          echo "========================================"
          echo "WEBSITE INSIDE APK"
          echo "========================================"

          unzip -l \
            android/app/build/outputs/apk/debug/app-debug.apk \
            | grep "assets/hisabpro" \
            | head -80


          echo "========================================"
          echo "NEXT.JS FILES"
          echo "========================================"

          unzip -l \
            android/app/build/outputs/apk/debug/app-debug.apk \
            | grep "assets/hisabpro/_next" \
            | head -30


          echo "========================================"
          echo "LAUNCHER ICON"
          echo "========================================"

          unzip -l \
            android/app/build/outputs/apk/debug/app-debug.apk \
            | grep "ic_launcher.png"


      # =========================================
      # UPLOAD APK
      # =========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: HisabPro-APK

          path: android/app/build/outputs/apk/debug/app-debug.apk
