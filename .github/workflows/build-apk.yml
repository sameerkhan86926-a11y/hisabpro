name: Build HisabPro APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # 1. CHECKOUT REPO
      # ============================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================
      # 2. SETUP NODE.JS 20
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ============================================
      # 3. SETUP JAVA 17
      # ============================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ============================================
      # 4. ACCEPT ANDROID LICENSES
      # ============================================
      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ============================================
      # 5. INSTALL & EXPORT NEXT.JS
      # ============================================
      - name: Install npm dependencies
        run: npm install

      - name: Build Next.js Static Export
        run: npm run build

      # ============================================
      # 6. INITIALIZE ANDROID PROJECT STRUCTURE
      # ============================================
      - name: Create Android project scaffolding
        run: |
          mkdir -p android/app/src/main/java/com/hisabpro/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/assets/hisabpro

      - name: Create gradle.properties
        run: |
          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          EOF

      # ============================================
      # 7. COPY NEXT.JS ASSETS & APP ICON
      # ============================================
      - name: Copy static export to Android assets
        run: |
          if [ -d "out" ]; then
            cp -R out/. android/app/src/main/assets/hisabpro/
          else
            echo "ERROR: 'out' directory not found. Ensure output: 'export' is configured in next.config.ts"
            exit 1
          fi

      - name: Copy App Launcher Icon
        run: |
          if [ -f "public/hisabpro/icon-512.png" ]; then
            cp public/hisabpro/icon-512.png android/app/src/main/res/drawable/ic_launcher.png
          elif [ -f "public/icon-512.png" ]; then
            cp public/icon-512.png android/app/src/main/res/drawable/ic_launcher.png
          elif [ -f "public/hisabpro/icon-192.png" ]; then
            cp public/hisabpro/icon-192.png android/app/src/main/res/drawable/ic_launcher.png
          elif [ -f "public/icon-192.png" ]; then
            cp public/icon-192.png android/app/src/main/res/drawable/ic_launcher.png
          else
            touch android/app/src/main/res/drawable/ic_launcher.png
          fi

      # ============================================
      # 8. GRADLE SETTINGS & BUILD CONFIG
      # ============================================
      - name: Create settings.gradle
        run: |
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HisabPro"
          include(":app")
          EOF

      - name: Create root build.gradle
        run: |
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Create app build.gradle
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hisabpro.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.hisabpro.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              androidResources {
                  ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

      # ============================================
      # 9. ANDROID MANIFEST WITH QUERIES & PERMISSIONS
      # ============================================
      - name: Create AndroidManifest.xml
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />

              <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="HisabPro"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create styles.xml
        run: |
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#102A56</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

      # ============================================
      # 10. MAIN ACTIVITY (CRASH FIX & CORS FETCH SETTINGS)
      # ============================================
      - name: Create MainActivity.java
        run: |
          cat > android/app/src/main/java/com/hisabpro/app/MainActivity.java <<'EOF'
          package com.hisabpro.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.util.Base64;
          import android.webkit.DownloadListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.MimeTypeMap;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.webkit.WebViewAssetLoader;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends Activity {
              private WebView webView;
              private WebViewAssetLoader assetLoader;
              private static final String APP_HOST = "appassets.androidplatform.net";

              private ValueCallback<Uri[]> fileUploadCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setAllowUniversalAccessFromFileURLs(true);

                  // 1. Bridges: Print aur Backup File Saver
                  webView.addJavascriptInterface(new PrintInterface(), "AndroidPrint");
                  webView.addJavascriptInterface(new FileSaverInterface(), "AndroidFileSaver");

                  // 2. File Chooser Handler (<input type="file">)
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams
                      ) {
                          if (fileUploadCallback != null) {
                              fileUploadCallback.onReceiveValue(null);
                          }
                          fileUploadCallback = filePathCallback;

                          Intent intent = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE);
                          } catch (Exception e) {
                              fileUploadCallback = null;
                              Toast.makeText(MainActivity.this, "File picker open nahi ho saka", Toast.LENGTH_SHORT).show();
                              return false;
                          }
                          return true;
                      }
                  });

                  // 3. File Download Handler
                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimeType, long contentLength) {
                          try {
                              if (url.startsWith("data:")) {
                                  String[] parts = url.split(",");
                                  if (parts.length > 1) {
                                      String meta = parts[0];
                                      String base64Data = parts[1];
                                      byte[] decodedBytes = Base64.decode(base64Data, Base64.DEFAULT);

                                      String ext = ".bin";
                                      if (meta.contains("csv")) ext = ".csv";
                                      else if (meta.contains("pdf")) ext = ".pdf";
                                      else if (meta.contains("json")) ext = ".json";
                                      else if (meta.contains("png")) ext = ".png";
                                      else if (meta.contains("jpeg") || meta.contains("jpg")) ext = ".jpg";

                                      saveToDownloads("HisabPro_" + System.currentTimeMillis() + ext, decodedBytes);
                                  }
                              } else {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(intent);
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Download error: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                          }
                      }
                  });

                  // 4. Asset Routing
                  assetLoader = new WebViewAssetLoader.Builder()
                          .setDomain(APP_HOST)
                          .addPathHandler("/hisabpro/", new HisabProPathHandler())
                          .build();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, String url) {
                          return assetLoader.shouldInterceptRequest(Uri.parse(url));
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleExternalUrl(request.getUrl().toString());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleExternalUrl(url);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);

                          // Hook standard window.print()
                          view.evaluateJavascript(
                              "window.print = function() { if (window.AndroidPrint) { window.AndroidPrint.print(); } };",
                              null
                          );

                          // Hook Blob download links (Create Backup Fix)
                          String blobInterceptScript =
                              "(function() {" +
                              "  var oldClick = HTMLAnchorElement.prototype.click;" +
                              "  HTMLAnchorElement.prototype.click = function() {" +
                              "    if (this.href && this.href.startsWith('blob:') && this.download && window.AndroidFileSaver) {" +
                              "      var filename = this.download;" +
                              "      fetch(this.href)" +
                              "        .then(function(r) { return r.text(); })" +
                              "        .then(function(content) {" +
                              "          window.AndroidFileSaver.saveBlob(filename, content);" +
                              "        });" +
                              "      return;" +
                              "    }" +
                              "    return oldClick.apply(this, arguments);" +
                              "  };" +
                              "})();";
                          view.evaluateJavascript(blobInterceptScript, null);
                      }
                  });

                  webView.loadUrl("https://" + APP_HOST + "/hisabpro/");
              }

              // Native File Saver Bridge for Backup JSON
              public class FileSaverInterface {
                  @JavascriptInterface
                  public void saveBlob(String filename, String content) {
                      runOnUiThread(() -> {
                          try {
                              String name = (filename != null && !filename.isEmpty()) ? filename : ("HisabPro_Backup_" + System.currentTimeMillis() + ".json");
                              saveToDownloads(name, content.getBytes(StandardCharsets.UTF_8));
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Backup save error: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                          }
                      });
                  }
              }

              private void saveToDownloads(String filename, byte[] bytes) {
                  try {
                      File path = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (!path.exists()) {
                          path.mkdirs();
                      }
                      File file = new File(path, filename);
                      FileOutputStream os = new FileOutputStream(file);
                      os.write(bytes);
                      os.close();
                      Toast.makeText(this, "Downloads me save ho gaya: " + filename, Toast.LENGTH_LONG).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "Save error: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                  }
              }

              private boolean handleExternalUrl(String url) {
                  if (url.startsWith("https://" + APP_HOST)) {
                      return false;
                  }

                  try {
                      if (url.startsWith("whatsapp:") || url.contains("wa.me") || url.contains("api.whatsapp.com")) {
                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          startActivity(intent);
                          return true;
                      }

                      if (url.startsWith("tel:") || url.startsWith("mailto:") || url.startsWith("sms:")) {
                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          startActivity(intent);
                          return true;
                      }

                      Intent browserIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      startActivity(browserIntent);
                      return true;
                  } catch (Exception e) {
                      Toast.makeText(this, "App open nahi ho saki: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                      return true;
                  }
              }

              // Native Android Print Implementation
              public class PrintInterface {
                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(() -> {
                          PrintManager printManager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                          PrintDocumentAdapter printAdapter = webView.createPrintDocumentAdapter("HisabPro_Document");
                          String jobName = "HisabPro Document";
                          if (printManager != null) {
                              printManager.print(jobName, printAdapter, new PrintAttributes.Builder().build());
                          }
                      });
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (fileUploadCallback != null) {
                          Uri[] results = null;
                          if (resultCode == Activity.RESULT_OK && data != null) {
                              String dataString = data.getDataString();
                              if (dataString != null) {
                                  results = new Uri[]{Uri.parse(dataString)};
                              }
                          }
                          fileUploadCallback.onReceiveValue(results);
                          fileUploadCallback = null;
                      }
                  } else {
                      super.onActivityResult(requestCode, resultCode, data);
                  }
              }

              private class HisabProPathHandler implements WebViewAssetLoader.PathHandler {
                  @Override
                  public WebResourceResponse handle(String path) {
                      String cleanPath = path != null ? path : "";

                      int queryIdx = cleanPath.indexOf("?");
                      if (queryIdx != -1) {
                          cleanPath = cleanPath.substring(0, queryIdx);
                      }
                      int hashIdx = cleanPath.indexOf("#");
                      if (hashIdx != -1) {
                          cleanPath = cleanPath.substring(0, hashIdx);
                      }

                      while (cleanPath.startsWith("/")) {
                          cleanPath = cleanPath.substring(1);
                      }

                      if (cleanPath.isEmpty() || cleanPath.endsWith("/")) {
                          cleanPath += "index.html";
                      } else if (!cleanPath.contains(".") && !cleanPath.startsWith("_next")) {
                          cleanPath += "/index.html";
                      }

                      String assetPath = "hisabpro/" + cleanPath;
                      try {
                          InputStream is = getAssets().open(assetPath);
                          String mimeType = getMimeType(cleanPath);

                          Map<String, String> responseHeaders = new HashMap<>();
                          responseHeaders.put("Access-Control-Allow-Origin", "*");
                          responseHeaders.put("Access-Control-Allow-Methods", "GET, OPTIONS");

                          return new WebResourceResponse(mimeType, "UTF-8", 200, "OK", responseHeaders, is);
                      } catch (Exception e) {
                          return null;
                      }
                  }
              }

              private String getMimeType(String path) {
                  if (path.endsWith(".css")) return "text/css";
                  if (path.endsWith(".js") || path.endsWith(".mjs")) return "application/javascript";
                  if (path.endsWith(".html") || path.endsWith(".htm")) return "text/html";
                  if (path.endsWith(".json")) return "application/json";
                  if (path.endsWith(".svg")) return "image/svg+xml";
                  if (path.endsWith(".png")) return "image/png";
                  if (path.endsWith(".jpg") || path.endsWith(".jpeg")) return "image/jpeg";
                  if (path.endsWith(".webp")) return "image/webp";
                  if (path.endsWith(".ico")) return "image/x-icon";
                  if (path.endsWith(".woff")) return "font/woff";
                  if (path.endsWith(".woff2")) return "font/woff2";
                  if (path.endsWith(".ttf")) return "font/ttf";

                  String extension = MimeTypeMap.getFileExtensionFromUrl(path);
                  if (extension != null && !extension.isEmpty()) {
                      String mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(extension.toLowerCase());
                      if (mime != null) return mime;
                  }
                  return "application/octet-stream";
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      webView.stopLoading();
                      webView.setWebViewClient(null);
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      # ============================================
      # 11. COMPILE APK VIA GRADLE
      # ============================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      # ============================================
      # 12. UPLOAD APK ARTIFACT
      # ============================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
