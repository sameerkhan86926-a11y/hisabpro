name: Build HisabPro APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # 1. CHECKOUT REPO
      # ============================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================
      # 2. SETUP NODE.JS (No lockfile cache dependency)
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ============================================
      # 3. SETUP JAVA 17
      # ============================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ============================================
      # 4. SETUP ANDROID SDK
      # ============================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # ============================================
      # 5. INSTALL & EXPORT NEXT.JS
      # ============================================
      - name: Install npm dependencies
        run: npm install

      - name: Build Next.js Static Export
        run: npm run build

      # ============================================
      # 6. INITIALIZE ANDROID PROJECT STRUCTURE
      # ============================================
      - name: Create Android project scaffolding
        run: |
          mkdir -p android/app/src/main/java/com/hisabpro/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/assets/hisabpro

      - name: Create gradle.properties
        run: |
          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      # ============================================
      # 7. COPY NEXT.JS ASSETS & APP ICON
      # ============================================
      - name: Copy static export to Android assets
        run: |
          if [ -d "out" ]; then
            cp -R out/. android/app/src/main/assets/hisabpro/
          else
            echo "ERROR: 'out' directory not found. Ensure output: 'export' is configured in next.config.ts"
            exit 1
          fi

      - name: Copy App Launcher Icon
        run: |
          if [ -f "public/hisabpro/icon-512.png" ]; then
            cp public/hisabpro/icon-512.png android/app/src/main/res/drawable/ic_launcher.png
          elif [ -f "public/icon-512.png" ]; then
            cp public/icon-512.png android/app/src/main/res/drawable/ic_launcher.png
          elif [ -f "public/hisabpro/icon-192.png" ]; then
            cp public/hisabpro/icon-192.png android/app/src/main/res/drawable/ic_launcher.png
          elif [ -f "public/icon-192.png" ]; then
            cp public/icon-192.png android/app/src/main/res/drawable/ic_launcher.png
          else
            echo "WARNING: Launcher icon missing, creating placeholder"
            touch android/app/src/main/res/drawable/ic_launcher.png
          fi

      # ============================================
      # 8. GRADLE SETTINGS & BUILD CONFIG
      # ============================================
      - name: Create settings.gradle
        run: |
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HisabPro"
          include(":app")
          EOF

      - name: Create root build.gradle
        run: |
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Create app build.gradle
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hisabpro.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.hisabpro.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

      # ============================================
      # 9. ANDROID MANIFEST & STYLES
      # ============================================
      - name: Create AndroidManifest.xml
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="HisabPro"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create styles.xml
        run: |
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#102A56</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

      # ============================================
      # 10. MAIN ACTIVITY (WEBVIEW ROUTING FIX)
      # ============================================
      - name: Create MainActivity.java
        run: |
          cat > android/app/src/main/java/com/hisabpro/app/MainActivity.java <<'EOF'
          package com.hisabpro.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.MimeTypeMap;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;
          import java.io.InputStream;

          public class MainActivity extends Activity {
              private WebView webView;
              private WebViewAssetLoader assetLoader;
              private static final String APP_HOST = "appassets.androidplatform.net";

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/hisabpro/", new HisabProPathHandler())
                          .build();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, String url) {
                          return assetLoader.shouldInterceptRequest(Uri.parse(url));
                      }
                  });

                  webView.loadUrl("https://" + APP_HOST + "/hisabpro/");
              }

              private class HisabProPathHandler implements WebViewAssetLoader.PathHandler {
                  @Override
                  public WebResourceResponse handle(String path) {
                      String cleanPath = path != null ? path : "";
                      while (cleanPath.startsWith("/")) {
                          cleanPath = cleanPath.substring(1);
                      }

                      if (cleanPath.isEmpty() || cleanPath.endsWith("/")) {
                          cleanPath += "index.html";
                      } else if (!cleanPath.contains(".")) {
                          cleanPath += "/index.html";
                      }

                      String assetPath = "hisabpro/" + cleanPath;
                      try {
                          InputStream is = getAssets().open(assetPath);
                          return new WebResourceResponse(getMimeType(cleanPath), "UTF-8", is);
                      } catch (Exception e) {
                          return null;
                      }
                  }
              }

              private String getMimeType(String path) {
                  String extension = MimeTypeMap.getFileExtensionFromUrl(path);
                  if (extension != null && !extension.isEmpty()) {
                      String mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(extension.toLowerCase());
                      if (mime != null) return mime;
                  }
                  if (path.endsWith(".js")) return "application/javascript";
                  if (path.endsWith(".css")) return "text/css";
                  if (path.endsWith(".json")) return "application/json";
                  if (path.endsWith(".svg")) return "image/svg+xml";
                  if (path.endsWith(".html")) return "text/html";
                  if (path.endsWith(".png")) return "image/png";
                  return "application/octet-stream";
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      webView.stopLoading();
                      webView.setWebViewClient(null);
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      # ============================================
      # 11. COMPILE APK VIA GRADLE
      # ============================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      # ============================================
      # 12. UPLOAD APK ARTIFACT
      # ============================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
