name: Build HisabPro APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Build Next.js website
        run: npm run build

      - name: Setup Android SDK PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p android/app/src/main/java/com/hisabpro/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/assets

      - name: Copy website into APK
        run: |
          cp -R out/. android/app/src/main/assets/

      - name: Create settings.gradle
        run: |
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HisabPro"
          include(":app")
          EOF

      - name: Create root build.gradle
        run: |
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Create app build.gradle
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hisabpro.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.hisabpro.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Create AndroidManifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="HisabPro"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create styles
        run: |
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1559B7</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#102A56</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>

          </resources>
          EOF

      - name: Create MainActivity
        run: |
          cat > android/app/src/main/java/com/hisabpro/app/MainActivity.java <<'EOF'
          package com.hisabpro.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import java.io.IOException;
          import java.io.InputStream;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                              WebView view,
                              WebResourceRequest request
                      ) {
                          return loadLocalAsset(
                                  request.getUrl().getPath()
                          );
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                              WebView view,
                              String url
                      ) {
                          return loadLocalAssetFromUrl(url);
                      }
                  });

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );
              }

              private WebResourceResponse loadLocalAssetFromUrl(
                      String url
              ) {
                  try {
                      String path = url;

                      int queryIndex = path.indexOf("?");

                      if (queryIndex >= 0) {
                          path = path.substring(
                                  0,
                                  queryIndex
                          );
                      }

                      int hashIndex = path.indexOf("#");

                      if (hashIndex >= 0) {
                          path = path.substring(
                                  0,
                                  hashIndex
                          );
                      }

                      if (path.startsWith("file:///hisabpro/")) {
                          path = path.substring(
                                  "file:///hisabpro/".length()
                          );
                      } else if (path.startsWith("file:///")) {
                          path = path.substring(
                                  "file:///".length()
                          );
                      } else {
                          return null;
                      }

                      return openAsset(path);

                  } catch (Exception e) {
                      return null;
                  }
              }

              private WebResourceResponse loadLocalAsset(
                      String path
              ) {
                  try {
                      if (path == null) {
                          return null;
                      }

                      if (path.startsWith("/hisabpro/")) {
                          path = path.substring(
                                  "/hisabpro/".length()
                          );
                      } else if (path.startsWith("/")) {
                          path = path.substring(1);
                      }

                      return openAsset(path);

                  } catch (Exception e) {
                      return null;
                  }
              }

              private WebResourceResponse openAsset(
                      String path
              ) {
                  if (path == null || path.isEmpty()) {
                      path = "index.html";
                  }

                  path = path.replace("\\", "/");

                  if (path.endsWith("/")) {
                      path = path + "index.html";
                  }

                  try {
                      InputStream inputStream =
                              getAssets().open(path);

                      String mimeType =
                              getMimeType(path);

                      return new WebResourceResponse(
                              mimeType,
                              "UTF-8",
                              inputStream
                      );

                  } catch (IOException e) {

                      if (!path.endsWith(".html")
                              && !path.contains(".")) {

                          try {
                              InputStream inputStream =
                                      getAssets().open(
                                              path + "/index.html"
                                      );

                              return new WebResourceResponse(
                                      "text/html",
                                      "UTF-8",
                                      inputStream
                              );

                          } catch (IOException ignored) {
                          }
                      }

                      return null;
                  }
              }

              private String getMimeType(
                      String path
              ) {

                  String lower =
                          path.toLowerCase(Locale.US);

                  if (lower.endsWith(".html")
                          || lower.endsWith(".htm")) {
                      return "text/html";
                  }

                  if (lower.endsWith(".css")) {
                      return "text/css";
                  }

                  if (lower.endsWith(".js")) {
                      return "application/javascript";
                  }

                  if (lower.endsWith(".json")) {
                      return "application/json";
                  }

                  if (lower.endsWith(".png")) {
                      return "image/png";
                  }

                  if (lower.endsWith(".jpg")
                          || lower.endsWith(".jpeg")) {
                      return "image/jpeg";
                  }

                  if (lower.endsWith(".webp")) {
                      return "image/webp";
                  }

                  if (lower.endsWith(".svg")) {
                      return "image/svg+xml";
                  }

                  if (lower.endsWith(".ico")) {
                      return "image/x-icon";
                  }

                  if (lower.endsWith(".txt")) {
                      return "text/plain";
                  }

                  if (lower.endsWith(".woff")) {
                      return "font/woff";
                  }

                  if (lower.endsWith(".woff2")) {
                      return "font/woff2";
                  }

                  if (lower.endsWith(".ttf")) {
                      return "font/ttf";
                  }

                  return "application/octet-stream";
              }

              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip

      - name: Build APK
        working-directory: android
        run: |
          ../gradle-8.10.2/bin/gradle assembleDebug

      - name: Verify APK
        run: |
          echo "===== APK FILE ====="
          ls -lh android/app/build/outputs/apk/debug/

          echo "===== APK CONTENT ====="
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | head -50

          echo "===== APK SIZE ====="
          du -h android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
